<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroundus</title>
    <!-- Google Fonts for premium cartoon & UI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for clean status icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=7">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Debug Console for catching runtime errors visually -->
    <div id="errorConsole" style="display:none; position:absolute; top:40px; left:50%; transform:translateX(-50%); background:rgba(220,53,69,0.95); color:white; padding:15px; z-index:99999; font-family:monospace; font-size:11px; border-radius:8px; width:80%; max-height:150px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid #ff8888;">
        <h4 style="margin-bottom:5px; color:#ffcccc;"><i class="fa-solid fa-triangle-exclamation"></i> Runtime Error Detected:</h4>
        <div id="errorMsgList"></div>
    </div>
    <script>
        function logRemote(msg, type) {
            fetch('/client_log?type=' + type + '&msg=' + encodeURIComponent(msg)).catch(e => {});
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
            // Ignore generic cross-origin or extension script errors
            if (message === 'Script error.' || !source || source.includes('extension') || lineno === 0) {
                return false;
            }
            const consoleDiv = document.getElementById('errorConsole');
            const listDiv = document.getElementById('errorMsgList');
            consoleDiv.style.display = 'block';
            const filename = source ? source.split('/').pop() : 'unknown';
            const errStr = message + ' (' + filename + ':' + lineno + ')';
            listDiv.innerHTML += '<div style="margin-top:4px; border-top:1px solid rgba(255,255,255,0.2); padding-top:4px;">' + errStr + '</div>';
            logRemote(errStr, 'onerror');
            return false;
        };

        const oldError = console.error;
        console.error = function() {
            const args = Array.from(arguments).join(' ');
            logRemote(args, 'console_error');
            oldError.apply(console, arguments);
        };
        
        const oldWarn = console.warn;
        console.warn = function() {
            const args = Array.from(arguments).join(' ');
            logRemote(args, 'console_warn');
            oldWarn.apply(console, arguments);
        };

        logRemote('Page script initialized', 'info');
    </script>

    <!-- 3D Canvas Game Viewport -->
    <canvas id="gameCanvas"></canvas>

    <!-- Camera Orbit/Zoom Touch Zone (Top area) -->
    <div class="camera-zone" id="cameraZone"></div>

    <!-- Overlay HUD UI -->
    <div class="game-hud" id="gameHUD">
        <!-- Instruction Overlay (Tap to start) -->
        <div class="start-screen" id="startScreen">
            <div class="start-title">
                <h1>Aroundus</h1>
                <p class="start-subtitle">Adventure World</p>
            </div>
            <div class="instructions-panel" style="display: flex; justify-content: center;">
                <div class="instruction-row">
                    <span class="action-side right-side">DRIVE</span>
                    <span class="action-desc"><i class="fa-solid fa-circle-dot"></i> Drag Right Side Joystick to Move & Steer</span>
                </div>
            </div>
            <button class="start-btn" id="startBtn">
                <i class="fa-solid fa-play"></i> START ENGINE
            </button>
        </div>

        <!-- Mini-Map GPS (Top Center) -->
        <div class="minimap-container" id="minimapContainer">
            <canvas id="minimapCanvas" width="120" height="120"></canvas>
        </div>

        <!-- Coin Counter Widget (Top Left) -->
        <div class="hud-widget coin-counter">
            <i class="fa-solid fa-coins"></i> Coins: <span id="coinVal">0</span>
        </div>

        <!-- Upgrade Widget (Top Left, below Coin Counter) -->
        <div class="hud-widget upgrade-widget" id="upgradeWidget">
            <span class="car-level-badge">LEVEL <span id="lvlVal">1</span></span>
            <button class="upgrade-btn disabled" id="upgradeBtn" disabled>
                <i class="fa-solid fa-bolt"></i> UPGRADE (10)
            </button>
        </div>

        <!-- Active Control Visualizers (Visible on Touch) -->
        <div class="touch-zones">
            <!-- Right Joystick Zone -->
            <div class="zone right-zone" id="rightZone">
                <div class="joystick-ring" id="joyRing">
                    <div class="joystick-dot" id="joyDot"></div>
                </div>
            </div>
        </div>

        <!-- Top Quick Utilities -->
        <div class="quick-utils">
            <button class="util-btn" id="resetBtn" title="Reset Car Position">
                <i class="fa-solid fa-arrows-spin"></i> Reset
            </button>
            <button class="util-btn" id="muteBtn" title="Mute/Unmute Music">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>

    <!-- Post‑processing and loader scripts -->
    <script src="https://unpkg.com/three@0.152.2/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/postprocessing/SSAOPass.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/loaders/RGBELoader.js"></script>
    <!-- Core Game Script -->
    <script src="game.js?v=20"></script>
</body>
</html>
